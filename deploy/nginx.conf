# Reverse proxy: nginx (80/443) -> gunicorn (127.0.0.1:8000).
# Положить в /etc/nginx/sites-available/agent-licence, затем:
#   ln -s /etc/nginx/sites-available/agent-licence /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# YOUR_HOST — домен или бесплатный DNS от IP через sslip.io, например:
#   167.99.12.34.sslip.io  (резолвится сам, ничего покупать не надо)
# После первого запуска nginx с этим конфигом на 80-м порту прогони:
#   certbot --nginx -d YOUR_HOST
# certbot сам допишет сюда server-блок на 443 с TLS.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_HOST;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
